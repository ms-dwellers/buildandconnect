name: BuildConnect
options:
  bundleIdPrefix: org.buildandconnect
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Configuration.xcconfig
  Release: Configuration.xcconfig
packages:
  MapboxMaps:
    url: https://github.com/mapbox/mapbox-maps-ios.git
    exactVersion: 11.34.2
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: NO
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  BuildConnect:
    type: application
    platform: iOS
    sources:
      - Sources
      - path: Resources
        buildPhase: resources
      - path: ../public/fonts
        buildPhase: resources
        excludes:
          - "space-mono*"
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Build & Connect
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        APIBaseURL: $(API_BASE_URL)
        MBXAccessToken: $(MAPBOX_PUBLIC_TOKEN)
        NSLocationWhenInUseUsageDescription: Use your location to choose a project area. You can always place a pin manually.
        NSMicrophoneUsageDescription: Animate the experimental voice studio using sound levels processed only on this device.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIAppFonts:
          - league-spartan-regular.ttf
          - league-spartan-medium.ttf
          - league-spartan-semibold.ttf
          - league-spartan-bold.ttf
          - dm-mono-regular.ttf
          - dm-mono-medium.ttf
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Light
    dependencies:
      - package: MapboxMaps
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.buildandconnect.iphone
        INFOPLIST_FILE: Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  BuildConnectTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: BuildConnect
  BuildConnectUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: BuildConnect
schemes:
  BuildConnect:
    build:
      targets:
        BuildConnect: all
    test:
      targets:
        - BuildConnectTests
        - BuildConnectUITests
